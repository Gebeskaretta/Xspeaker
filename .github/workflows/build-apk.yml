name: Xspeaker Android TV APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Xspeaker TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9+ & Gradle 9+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare Keystore & Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect Output APKs
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apks/Xspeaker-TV-v1.0.apk \;
          ls -la output_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xspeaker-AndroidTV-APK
          path: output_apks/*.apk
          if-no-files-found: error
          retention-days: 90
