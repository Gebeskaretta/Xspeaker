name: Xspeaker Android TV APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Xspeaker TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output_apks
          cp app/build/outputs/apk/debug/app-debug.apk output_apks/Xspeaker-TV-v1.0.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xspeaker-AndroidTV-APK
          path: output_apks/*.apk
          retention-days: 90
